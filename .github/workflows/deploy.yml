name: Build & Deploy to cPanel

on:
  push:
    branches: [production]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Install lftp
        run: sudo apt-get update -qq && sudo apt-get install -y -qq lftp

      - name: Deploy via SFTP
        run: |
          lftp -u "${{ secrets.FTP_USER }},${{ secrets.FTP_PASS }}" \
               -e "set sftp:auto-confirm yes; mirror -R --verbose dist/ ${{ secrets.FTP_PATH }}; quit" \
               sftp://${{ secrets.FTP_HOST }}
